name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK Platform 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Exists
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Teleprompter Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Diagnostic Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostic-logs
          path: |
            app/build/reports/
            **/build/**/*.log
